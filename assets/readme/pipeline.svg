<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">C4Future architecture</title>
  <desc id="d">Two animated pipelines. ML predictor: product input, feature encoding, three XGBoost models, conformal calibration, SHAP, result. RAG advisor: question, MiniLM embedding, ChromaDB retrieval, cross-encoder rerank, GPT-4o-mini streaming, cited answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#050810"/></linearGradient>
