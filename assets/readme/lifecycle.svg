<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">From cradle to checkout</title>
  <desc id="d">Animated supply-chain route: a parcel travels from raw material to factory, freight and consumer, adding 2.75, 1.05 and 3.80 kg CO2e for a total of 7.60 kg.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#050810"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64ffb4"/><stop offset=".55" stop-color="#00d9ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="card"><rect width="1280" height="380" rx="22"/></clipPath>
  </defs>
  <style>
    .draw { stroke-dasharray: 1; animation: draw 10s linear infinite; }
    @keyframes draw { 0%,4% { stroke-dashoffset: 1; } 66%,100% { stroke-dashoffset: 0; } }
    .cycle { animation: cycle 10s linear infinite; }
    @keyframes cycle { 0% { opacity: 0; } 3%,92% { opacity: 1; } 100% { opacity: 0; } }
    .flow { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
        @keyframes pop0 { 0%,3.9% { transform: scale(0); } 7.0% { transform: scale(1.25); } 10.0%,100% { transform: scale(1); } }
    .pop0 { animation: pop0 10s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes chip0 { 0%,4.0% { opacity: 0; transform: translateY(10px); } 8.0%,90% { opacity: 1; transform: none; } 97%,100% { opacity: 0; } }
    .chip0 { animation: chip0 10s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes puff0 { 0%,4.0% { opacity: 0; transform: translate(0,0) scale(.4); } 5.0% { opacity: .85; } 18.0%,100% { opacity: 0; transform: translate(14px,-26px) scale(1.6); } }
    .puff0 { animation: puff0 10s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop1 { 0%,25.9% { transform: scale(0); } 29.0% { transform: scale(1.25); } 32.0%,100% { transform: scale(1); } }
    .pop1 { animation: pop1 10s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes chip1 { 0%,26.0% { opacity: 0; transform: translateY(10px); } 30.0%,90% { opacity: 1; transform: none; } 97%,100% { opacity: 0; } }
    .chip1 { animation: chip1 10s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes puff1 { 0%,26.0% { opacity: 0; transform: translate(0,0) scale(.4); } 27.0% { opacity: .85; } 40.0%,100% { opacity: 0; transform: translate(14px,-26px) scale(1.6); } }
    .puff1 { animation: puff1 10s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop2 { 0%,45.9% { transform: scale(0); } 49.0% { transform: scale(1.25); } 52.0%,100% { transform: scale(1); } }
    .pop2 { animation: pop2 10s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes chip2 { 0%,46.0% { opacity: 0; transform: translateY(10px); } 50.0%,90% { opacity: 1; transform: none; } 97%,100% { opacity: 0; } }
    .chip2 { animation: chip2 10s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes puff2 { 0%,46.0% { opacity: 0; transform: translate(0,0) scale(.4); } 47.0% { opacity: .85; } 60.0%,100% { opacity: 0; transform: translate(14px,-26px) scale(1.6); } }
    .puff2 { animation: puff2 10s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop3 { 0%,65.9% { transform: scale(0); } 69.0% { transform: scale(1.25); } 72.0%,100% { transform: scale(1); } }
    .pop3 { animation: pop3 10s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes chip3 { 0%,66.0% { opacity: 0; transform: translateY(10px); } 70.0%,90% { opacity: 1; transform: none; } 97%,100% { opacity: 0; } }
    .chip3 { animation: chip3 10s cubic-bezier(.16,1,.3,1) infinite; }
    @keyframes puff3 { 0%,66.0% { opacity: 0; transform: translate(0,0) scale(.4); } 67.0% { opacity: .85; } 80.0%,100% { opacity: 0; transform: translate(14px,-26px) scale(1.6); } }
    .puff3 { animation: puff3 10s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bar0 { 0%,4.0% { transform: scaleX(0); } 12.0%,92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .bar0 { animation: bar0 10s cubic-bezier(.16,1,.3,1) infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes bar1 { 0%,26.0% { transform: scaleX(0); } 34.0%,92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .bar1 { animation: bar1 10s cubic-bezier(.16,1,.3,1) infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes bar2 { 0%,46.0% { transform: scaleX(0); } 54.0%,92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .bar2 { animation: bar2 10s cubic-bezier(.16,1,.3,1) infinite; transform-box: fill-box; transform-origin: left; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } }
  </style>
  <g clip-path="url(#card)" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
    <rect width="1280" height="380" fill="url(#bg)"/>
    <ellipse cx="640" cy="380" rx="520" ry="90" fill="#8b5cf6" opacity=".08" filter="url(#glow)"/>
    <text x="48" y="54" font-size="13" font-weight="700" letter-spacing="3" fill="#64ffb4">— LIFECYCLE</text>
    <text x="48" y="88" font-size="28" font-weight="800" fill="#f0f4ff">From cradle to <tspan fill="url(#brand)">checkout</tspan></text>
    <text x="48" y="114" font-size="14" fill="#5d6d8c">Cotton product · 0.5 kg · China → 8,000 km by air</text>

    <path class="flow" d="M150,262 C260,262 370,166 480,166 S700,262 810,262 S1030,166 1140,166" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="2" stroke-dasharray="6 8"/>
    <g class="cycle">
      <path class="draw" pathLength="1" d="M150,262 C260,262 370,166 480,166 S700,262 810,262 S1030,166 1140,166" fill="none" stroke="url(#brand)" stroke-width="10" stroke-opacity=".35" filter="url(#glow)"/>
      <path class="draw" pathLength="1" d="M150,262 C260,262 370,166 480,166 S700,262 810,262 S1030,166 1140,166" fill="none" stroke="url(#brand)" stroke-width="3.5" stroke-linecap="round"/>
    <g>
      <circle class="puff0" style="animation-delay:0.00s" cx="171" cy="244" r="7" fill="#9aa6bd"/><circle class="puff0" style="animation-delay:0.12s" cx="184" cy="244" r="6" fill="#9aa6bd"/><circle class="puff0" style="animation-delay:0.24s" cx="197" cy="244" r="5" fill="#9aa6bd"/>
      <g class="pop0"><circle cx="150" cy="262" r="27" fill="#070b16" stroke="#64ffb4" stroke-width="2.5"/><g transform="translate(150 262)"><path d="M-9,7 C-9,-5 1,-10 10,-9 C11,-1 6,9 -7,8 Z" fill="#64ffb4"/><path d="M-7,7 L6,-5" stroke="#05200f" stroke-width="1.6"/></g></g>
      <text x="150" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#9fb0d0">Raw material</text>
    </g>
    <g class="chip0">
      <rect x="72" y="179" width="156" height="30" rx="15" fill="#64ffb4" fill-opacity=".1" stroke="#64ffb4" stroke-opacity=".5"/>
      <text x="150" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#64ffb4">+2.75 kg <tspan font-weight="500" fill="#9fb0d0">material</tspan></text>
    </g>
    <g>
      <circle class="puff1" style="animation-delay:0.00s" cx="501" cy="148" r="7" fill="#9aa6bd"/><circle class="puff1" style="animation-delay:0.12s" cx="514" cy="148" r="6" fill="#9aa6bd"/><circle class="puff1" style="animation-delay:0.24s" cx="527" cy="148" r="5" fill="#9aa6bd"/>
      <g class="pop1"><circle cx="480" cy="166" r="27" fill="#070b16" stroke="#00d9ff" stroke-width="2.5"/><g transform="translate(480 166)"><path d="M-11,9 V-1 L-5,-5 V-1 L1,-5 V-1 L7,-5 V9 Z" fill="#00d9ff"/><rect x="5" y="-11" width="4" height="8" fill="#00d9ff"/><rect x="-7" y="2" width="3" height="3" fill="#03131a"/><rect x="-1" y="2" width="3" height="3" fill="#03131a"/></g></g>
      <text x="480" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#9fb0d0">Factory</text>
    </g>
    <g class="chip1">
      <rect x="402" y="83" width="156" height="30" rx="15" fill="#00d9ff" fill-opacity=".1" stroke="#00d9ff" stroke-opacity=".5"/>
      <text x="480" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#00d9ff">+1.05 kg <tspan font-weight="500" fill="#9fb0d0">manufacturing</tspan></text>
    </g>
    <g>
      <circle class="puff2" style="animation-delay:0.00s" cx="831" cy="244" r="7" fill="#9aa6bd"/><circle class="puff2" style="animation-delay:0.12s" cx="844" cy="244" r="6" fill="#9aa6bd"/><circle class="puff2" style="animation-delay:0.24s" cx="857" cy="244" r="5" fill="#9aa6bd"/>
      <g class="pop2"><circle cx="810" cy="262" r="27" fill="#070b16" stroke="#8b5cf6" stroke-width="2.5"/><g transform="translate(810 262)"><path d="M-12,2 H12 L8,9 H-8 Z" fill="#8b5cf6"/><rect x="-8" y="-5" width="6" height="6" fill="#b9a6ff"/><rect x="-1" y="-5" width="6" height="6" fill="#8b5cf6"/><rect x="-1" y="-11" width="6" height="5" fill="#b9a6ff"/></g></g>
      <text x="810" y="314" text-anchor="middle" font-size="15" font-weight="600" fill="#9fb0d0">Freight</text>
    </g>
    <g class="chip2">
      <rect x="732" y="179" width="156" height="30" rx="15" fill="#8b5cf6" fill-opacity=".1" stroke="#8b5cf6" stroke-opacity=".5"/>
      <text x="810" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#8b5cf6">+3.80 kg <tspan font-weight="500" fill="#9fb0d0">transport</tspan></text>
    </g>
    <g>
      
      <g class="pop3"><circle cx="1140" cy="166" r="27" fill="#070b16" stroke="#f0f4ff" stroke-width="2.5"/><g transform="translate(1140 166)"><rect x="-9" y="-4" width="18" height="14" rx="2" fill="#f0f4ff"/><path d="M-5,-4 V-7 A5,5 0 0 1 5,-7 V-4" fill="none" stroke="#f0f4ff" stroke-width="2"/></g></g>
      <text x="1140" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#9fb0d0">Consumer</text>
    </g>
    <g class="chip3">
      <rect x="1036" y="76" width="208" height="46" rx="14" fill="#64ffb4" fill-opacity=".12" stroke="url(#brand)" stroke-width="1.5"/>
      <text x="1140" y="106" text-anchor="middle" font-size="22" font-weight="800" fill="url(#brand)">= 7.60 kg CO₂e</text>
    </g>
    <rect class="bar0" x="150.0" y="340" width="358.2" height="10" rx="5" fill="#64ffb4"/>
    <rect class="bar1" x="508.2" y="340" width="136.8" height="10" rx="5" fill="#00d9ff"/>
    <rect class="bar2" x="645.0" y="340" width="495.0" height="10" rx="5" fill="#8b5cf6"/>
      <g>
        <rect x="-12" y="-10" width="24" height="20" rx="4" fill="#64ffb4"/><path d="M-12,-2 H12 M0,-10 V10" stroke="#04110b" stroke-width="1.6"/>
        <animateMotion dur="10s" repeatCount="indefinite" path="M150,262 C260,262 370,166 480,166 S700,262 810,262 S1030,166 1140,166" rotate="auto" keyPoints="0;0;1;1" keyTimes="0;0.04;0.66;1" calcMode="linear"/>
      </g>
    </g>
    <rect x="150" y="340" width="990" height="10" rx="5" fill="#ffffff" fill-opacity=".06"/>
    <g font-size="12" fill="#5d6d8c"><text x="150" y="370">Material · Manufacturing · Transport share of the factor breakdown</text></g>
  </g>
  <rect x=".5" y=".5" width="1279" height="379" rx="22" fill="none" stroke="url(#brand)" stroke-opacity=".3"/>
</svg>
