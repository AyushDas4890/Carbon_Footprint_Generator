    <circle cx="985" cy="228" r="138" fill="url(#sphere)"/>
    <g clip-path="url(#globe)" fill="none" stroke="#64ffb4" stroke-width="1.1">
      <g stroke-opacity=".28">
      <ellipse cx="985" cy="128" rx="95.1" ry="15.2"/><ellipse cx="985" cy="168" rx="124.3" ry="19.9"/><ellipse cx="985" cy="208" rx="136.5" ry="21.8"/><ellipse cx="985" cy="248" rx="136.5" ry="21.8"/><ellipse cx="985" cy="288" rx="124.3" ry="19.9"/><ellipse cx="985" cy="328" rx="95.1" ry="15.2"/>
