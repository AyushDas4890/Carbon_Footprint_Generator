<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">C4Future</title>
  <desc id="d">Animated banner: a rotating wireframe Earth with orbiting CO2 molecules beside the C4Future title and the tagline "Calculate the true carbon cost of any product".</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffb4"/><stop offset=".55" stop-color="#00d9ff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#64ffb4"/><stop offset=".33" stop-color="#00d9ff"/>
      <stop offset=".66" stop-color="#8b5cf6"/><stop offset="1" stop-color="#64ffb4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;760 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sphere" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#0f3a35"/><stop offset=".6" stop-color="#071a22"/><stop offset="1" stop-color="#040a12"/>
    </radialGradient>
    <radialGradient id="atmo" cx=".5" cy=".5" r=".5">
      <stop offset=".78" stop-color="#00d9ff" stop-opacity="0"/><stop offset=".9" stop-color="#00d9ff" stop-opacity=".22"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="385" width="1280" height="75" fill="url(#floorFade)"/></mask>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1280" height="460" rx="22"/></clipPath>
    <clipPath id="globe"><circle cx="985" cy="228" r="138"/></clipPath>
    <clipPath id="reveal"><rect x="70" y="120" width="0" height="130">
      <animate attributeName="width" from="0" to="760" begin="0.3s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    </rect></clipPath>
    <clipPath id="type"><rect x="78" y="258" width="0" height="40">
      <animate attributeName="width" from="0" to="640" begin="1.5s" dur="2.6s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="titleShape"><text x="76" y="232" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-2">C4FUTURE</text></clipPath>
  </defs>
  <style>
    .tw { animation: twinkle 3s ease-in-out infinite; }
    .t1 { animation-duration: 4.2s; animation-delay: -1s; }
    .t2 { animation-duration: 2.6s; animation-delay: -2s; }
    .t3 { animation-duration: 5.1s; animation-delay: -.5s; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .aurora { animation: drift 14s ease-in-out infinite alternate; }
    .aurora.b { animation-duration: 18s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translate(-40px, 10px); } to { transform: translate(60px, -20px); } }
    .mer { transform-box: fill-box; transform-origin: center; animation: spin 6s ease-in-out infinite; }
    @keyframes spin { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
    .floor { animation: floor 1.6s linear infinite; }
    @keyframes floor { from { transform: translateY(0); } to { transform: translateY(13px); } }
    .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
    .caret { animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade { opacity: 0; animation: fadeUp .8s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .glintbar { animation: glint 6s ease-in-out 2s infinite; }
    @keyframes glint { 0% { transform: translateX(-260px) skewX(-20deg); } 35%,100% { transform: translateX(900px) skewX(-20deg); } }
    .breathe { animation: breathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } }
  </style>

