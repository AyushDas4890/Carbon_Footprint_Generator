<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 28" width="1280" height="28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffb4" stop-opacity="0"/><stop offset=".2" stop-color="#64ffb4" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#00d9ff" stop-opacity=".7"/><stop offset=".8" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#64ffb4"/><stop offset="1" stop-color="#64ffb4" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .run { animation: run 4.5s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes run { 0% { transform: translateX(80px); opacity: 0; } 10%,90% { opacity: 1; } 100% { transform: translateX(1200px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="13" width="1280" height="2" fill="url(#line)"/>
  <g class="run"><ellipse cx="0" cy="14" rx="60" ry="7" fill="url(#dot)"/></g>
</svg>
