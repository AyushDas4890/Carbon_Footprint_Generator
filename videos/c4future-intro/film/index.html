<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>C4Future intro</title>
<style>
  /* One display face, one UI face. Point these at the brand's real files in assets/fonts/ (capture.mjs lists them). */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/SpaceGrotesk.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/Inter.woff2) format('woff2'); font-weight: 100 900; }
  :root {
    /* style guide tokens: ONE accent unless the brief says otherwise */
    --bg: #050810; --ink: #f0f4ff; --ink-2: #8899bb; --accent: #64ffb4; --card: #0d1525; --cyan: #00d9ff;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: var(--bg); transform-origin: 0 0;
           font-family: 'UI', 'Helvetica Neue', Arial, sans-serif; color: var(--ink);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .display { font-family: 'Display', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: -0.03em;
             line-height: 0.95; white-space: nowrap; }
  /* a line is a mask: words rise through it. Padding keeps descenders; start words >= 140% below so no sliver shows. */
  .line { position: absolute; overflow: hidden; padding: 0.08em 0.04em 0.18em; margin: -0.08em -0.04em 0; white-space: nowrap; }
  .word { display: inline-block; }
  .card { position: absolute; background: var(--card); border-radius: 28px;
          box-shadow: 0 2px 6px rgba(0,0,0,.4), 0 40px 90px -20px rgba(0,0,0,.85); }
  .shot { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 20px; border: 1px solid rgba(255,255,255,.08);
          box-shadow: 0 2px 6px rgba(0,0,0,.4), 0 40px 90px -20px rgba(0,0,0,.85); }
  .shot img, .abs img { position: absolute; left: 0; top: 0; display: block; }
  .ui { font-family: 'UI', Arial, sans-serif; font-weight: 500; letter-spacing: -0.01em; line-height: 1.1; }
  body.play { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lib/motion.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="type.js"></script>
<script src="film.js"></script>
</body>
</html>
